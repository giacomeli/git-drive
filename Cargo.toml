[package]
name = "drive-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
fuser = { version = "0.14", features = ["abi-7-21"] }
libc = "0.2"
git2 = "0.18"
anyhow = "1.0"
parking_lot = "0.12"
tokio = { version = "1.36", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.11"
sha2 = "0.10"
tray-icon = "0.24.1"
tao = "0.35.3"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

# Patch local em fuser 0.14.0: corrige panic em SetAttr::crtime/chgtime/bkuptime
# (overflow `Instant + Duration`) que mata o daemon quando o Finder envia
# SETATTR com crtime ruim ao colar arquivos. Bug ainda presente em fuser 0.17
# upstream. Ver vendor/fuser/src/ll/request.rs (procurar "PATCH local").
[patch.crates-io]
fuser = { path = "vendor/fuser" }
