[package]
name = "git-drive"
version = "0.3.0"
edition = "2021"
description = "Mount a Git repository as a filesystem: a FUSE drive with automatic bidirectional Git sync"
license = "MIT"
repository = "https://github.com/giacomeli/git-drive"
keywords = ["git", "fuse", "filesystem", "sync", "encryption"]
categories = ["filesystem", "command-line-utilities"]

# The Control Center (a Tauri GUI) is a workspace member outside the default
# members: `cargo build`/`test`/`clippy` at the root build only the daemon (and
# `state/`, its observable state, which the apps share) and never need Node or
# a webview. Build it with `npm run tauri build` in `control-center/`.
# UnniFiles, the file manager, lives in its own repository and links `state/`
# by path from beside this one.
[workspace]
members = [".", "state", "control-center/src-tauri"]
default-members = [".", "state"]

[dependencies]
# status.json, paths and disk figures; also linked by the apps, alone.
git-drive-state = { path = "state" }
fuser = { version = "0.14", features = ["abi-7-21"] }
libc = "0.2"
git2 = "0.18"
anyhow = "1.0"
parking_lot = "0.12"
tokio = { version = "1.36", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
flexi_logger = "0.29"
eframe = "0.29"
# `asm`: hardware SHA-256 (ARMv8 SHA2 / x86 SHA-NI), 7x faster on the Mac
# (314 -> 2137 MB/s) — chunk checks and the drain's chunking sweep hash
# hundreds of MB per large file.
sha2 = { version = "0.10", features = ["asm"] }
chacha20poly1305 = "0.10"
# Direct use of the primitives under chacha20poly1305 (already resolved
# transitively): seekable keystream for range decryption and a streaming
# Poly1305 tag check (src/crypt.rs).
chacha20 = "0.9"
poly1305 = "0.8"
# Git blob ids of large working-tree files, hashed in the same streaming pass
# as the AEAD tag check (src/range_read.rs) — 1.7x the sha1dc that
# `git2::Oid::hash_file` uses, and through the handle that will serve reads.
sha1 = "0.10"
hkdf = "0.12"
hmac = "0.12"
getrandom = "0.2"
tray-icon = "0.24.1"
tao = "0.35.3"
# P2P notification channel (feature `p2p`): devices dialed by public key, QUIC
# with hole punching and relay fallback. No default features: the Apple fast
# datapath uses private APIs and the metrics have no consumer here.
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "portmapper"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The tray reads its menu bar's appearance to draw its icon light or dark; the
# versions tray-icon already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSAppearance",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }

[features]
default = ["p2p"]
# Requires Rust 1.91 (iroh 1.3); the core builds without it on the project MSRV.
p2p = ["dep:iroh"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"

# Local patch on fuser 0.14.0: fixes a panic in SetAttr::crtime/chgtime/bkuptime
# (`Instant + Duration` overflow) that kills the daemon when Finder sends a
# SETATTR with a bad crtime while pasting files. Bug still present in fuser
# 0.17 upstream. See vendor/fuser/src/ll/request.rs (search for "PATCH local").
[patch.crates-io]
fuser = { path = "vendor/fuser" }
