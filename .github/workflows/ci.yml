# CI de verificação (Fase 3, fatia 1).
#
# Cláusula de desacoplamento: este workflow apenas EXECUTA os mesmos comandos
# da seção "Comandos de verificação" do CLAUDE.md. Nenhum código do software
# conhece ou depende do CI — se este arquivo sumir, nada no drive-sync muda.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
      - name: Suite completa (mesma do CLAUDE.md)
        run: cargo test

  clippy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
      - name: Clippy (warnings fora de vendor/ sao regressao)
        run: |
          cargo clippy --all-targets --message-format short 2>&1 \
            | grep -E '^(src|tests)/.*(warning|error)' > clippy-projeto.txt || true
          if [ -s clippy-projeto.txt ]; then
            echo "Warnings novos fora de vendor/:"
            cat clippy-projeto.txt
            exit 1
          fi

  padroes-proibidos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Padroes proibidos da Fase 0
        run: |
          ! grep -rn "op_priority" src/
          ! grep -n "unwrap_or(&self.alloc_inode" src/fs.rs
      - name: Clausula de desacoplamento (software nao conhece o CI)
        run: |
          ! grep -rnE 'GITHUB_|env!\("CI"\)|var\("CI"\)' src/ tests/

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
      - name: Dependencias de sistema (GTK para tray-icon/tao)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: MSRV 1.77 declarada no projeto
        run: |
          rustup toolchain install 1.77 --profile minimal
          cargo +1.77 check --all-targets

  # Fumaca Linux: sinalizacao, nao gate — o port funcional (mount fuse3,
  # systemd, notificacoes) e fatia futura da Fase 3. Vira job obrigatorio
  # quando a compilacao Linux for confirmada.
  test-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
      - name: Dependencias de sistema (GTK para tray-icon/tao)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Suite no Linux (fumaca)
        run: cargo test
