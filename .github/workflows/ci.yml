# Verification CI (Phase 3, slice 1).
#
# Decoupling clause: this workflow only RUNS the same commands from the
# "Verification commands" section of CLAUDE.md. No code in the software knows
# about or depends on the CI — if this file disappears, nothing in drive-sync
# changes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
      - name: macFUSE (SDK for the vendor/fuser build.rs; the kext does not load in CI)
        run: brew install --cask macfuse
      - name: Full suite (same as CLAUDE.md)
        run: cargo test

  clippy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
      - name: macFUSE (SDK for the vendor/fuser build.rs; the kext does not load in CI)
        run: brew install --cask macfuse
      # Two steps on purpose: the first fails the job on a compilation error
      # (a grep filter used to mask that case — learned in the first run);
      # the second applies the project rule (warning outside vendor/ = failure).
      - name: Clippy compiles
        run: cargo clippy --all-targets
      - name: Warnings outside vendor/ are a regression
        run: |
          cargo clippy --all-targets --message-format short 2>&1 \
            | grep -E '^(src|tests)/.*(warning|error)' > clippy-projeto.txt || true
          if [ -s clippy-projeto.txt ]; then
            echo "New warnings outside vendor/:"
            cat clippy-projeto.txt
            exit 1
          fi

  padroes-proibidos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase 0 forbidden patterns
        run: |
          ! grep -rn "op_priority" src/
          ! grep -n "unwrap_or(&self.alloc_inode" src/fs.rs
      - name: Decoupling clause (the software does not know about the CI)
        run: |
          ! grep -rnE 'GITHUB_|env!\("CI"\)|var\("CI"\)' src/ tests/

  # MSRV verified on macOS (the platform supported today). On Linux, transitive
  # deps of the GTK tree require edition2024 (cargo 1.85+) — the Linux MSRV
  # will be defined in the port slice.
  msrv:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
      - name: macFUSE (SDK for the vendor/fuser build.rs; the kext does not load in CI)
        run: brew install --cask macfuse
      # 1.85 is the real floor of the current lock: unicode-segmentation 1.13.3
      # declares rust-version 1.85 (litemap/zerofrom ask for 1.81; the lock's
      # v4 format already required 1.78). Validated with
      # `rustup run 1.85 cargo check --all-targets`.
      - name: MSRV 1.85 declared by the project
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup run 1.85 cargo check --all-targets

  # Promoted to a gate on 2026-07-06: the full suite passed on the first green
  # run. What remains of the Linux port is runtime (fuse3 mount, systemd,
  # notifications) — a future slice of Phase 3.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
      - name: System dependencies (GTK for tray-icon/tao, libfuse3 for vendor/fuser)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libfuse3-dev
      - name: Suite on Linux (smoke)
        run: cargo test
