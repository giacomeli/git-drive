[package]
name = "git-drive-files"
version = "0.3.0"
edition = "2021"
description = "git-drive Files: a file manager with the Control Center's look (proof of concept)"
license = "MIT"
publish = false

[[bin]]
name = "git-drive-files"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# The daemon's status, paths and disk figures only: no FUSE and no Git, so
# the app opens on a Mac without macFUSE (or Homebrew's OpenSSL).
git-drive-state = { path = "../../state" }
tauri = { version = "2.12", features = ["macos-private-api", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Icon view thumbnails of raster images, decoded and scaled in process.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Scratch folder for Quick Look's thumbnails (macOS).
tempfile = "3"
trash = "5.2"
# Renames that never replace an item (renamex_np on macOS, renameat2 on Linux).
libc = "0.2"
# App icons of Open With, sent to the menu as PNG data URLs.
base64 = "0.22"
# The terminal panel's pseudo-terminals.
portable-pty = "0.9"
# Properties: extended attributes; image metadata read in pure Rust (EXIF from
# JPEG, HEIF, PNG, WebP, TIFF and raw files; XMP parsed and merged), written
# into JPEG and PNG without re-encoding them.
xattr = "1.6"
kamadak-exif = "0.6.1"
quick-xml = "0.42"
crc32fast = "1.5"
# The system's preferred languages (the app follows them unless Settings says otherwise).
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"
# HEIC metadata written by the system (a lossless copy with new metadata).
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "CGImageMetadata", "CGImageProperties"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFString", "CFURL", "CFDictionary", "CFNumber", "CFArray", "CFError"] }
# The drag out of the window (native_drag.rs); the versions Tauri already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "bitflags",
  "block2",
  "NSApplication",
  "NSBitmapImageRep",
  "NSGraphics",
  "NSDragging",
  "NSDraggingItem",
  "NSDraggingSession",
  "NSEvent",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSPasteboard",
  "NSResponder",
  "NSScreen",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The drag out of the window (native_drag.rs); the GTK 3 Tauri already uses.
gtk = "0.18"
